<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0;background:#0A0A0A;color:#EDEDED;font:13px/1.5 ui-sans-serif,system-ui,sans-serif}
.wrap{padding:24px}.g{display:flex;gap:14px}
.c{border:1px solid #1e1e1e;border-radius:12px;padding:14px;background:#060606;width:270px}
.t{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#E9A23B;margin:0 0 8px}
.big{width:118px;height:118px;display:block;margin:0 auto 8px}
.s{display:flex;gap:10px;align-items:flex-end;justify-content:center;border-top:1px solid #191919;padding-top:10px}
.n{font:9px ui-monospace,monospace;color:#4d4d4d;text-align:center;margin-top:3px}
.chip{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;margin:0 4px}
.dark{background:#000;border:1px solid #1e1e1e}.sig{background:#E9A23B}.light{background:#FAFAF9}
.chip img{width:26px;height:26px}
</style></head><body><div class=wrap><div class=g>
<div class=c><p class=t>r1-flat</p><img class=big src="r1-flat.svg" alt=""><div class=s><div><img src="r1-flat.svg" width=44 height=44><div class=n>44</div></div><div><img src="r1-flat.svg" width=24 height=24><div class=n>24</div></div><div><img src="r1-flat.svg" width=16 height=16><div class=n>16</div></div></div><div style="text-align:center"><div class="chip dark"><img src="r1-flat.svg"></div><div class="chip sig"><img src="r1-flat.svg"></div></div></div>
<div class=c><p class=t>r2-chisel</p><img class=big src="r2-chisel.svg" alt=""><div class=s><div><img src="r2-chisel.svg" width=44 height=44><div class=n>44</div></div><div><img src="r2-chisel.svg" width=24 height=24><div class=n>24</div></div><div><img src="r2-chisel.svg" width=16 height=16><div class=n>16</div></div></div><div style="text-align:center"><div class="chip dark"><img src="r2-chisel.svg"></div><div class="chip sig"><img src="r2-chisel.svg"></div></div></div>
<div class=c><p class=t>r3-soft</p><img class=big src="r3-soft.svg" alt=""><div class=s><div><img src="r3-soft.svg" width=44 height=44><div class=n>44</div></div><div><img src="r3-soft.svg" width=24 height=24><div class=n>24</div></div><div><img src="r3-soft.svg" width=16 height=16><div class=n>16</div></div></div><div style="text-align:center"><div class="chip dark"><img src="r3-soft.svg"></div><div class="chip sig"><img src="r3-soft.svg"></div></div></div>
<div class=c><p class=t>r4-square-bowl</p><img class=big src="r4-square-bowl.svg" alt=""><div class=s><div><img src="r4-square-bowl.svg" width=44 height=44><div class=n>44</div></div><div><img src="r4-square-bowl.svg" width=24 height=24><div class=n>24</div></div><div><img src="r4-square-bowl.svg" width=16 height=16><div class=n>16</div></div></div><div style="text-align:center"><div class="chip dark"><img src="r4-square-bowl.svg"></div><div class="chip sig"><img src="r4-square-bowl.svg"></div></div></div>
</div></div></body></html>
