<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="dok">
  <title>dok</title>
  <!-- dok mark: a deployment tile with the wordmark's d carved out of it.
       32-unit grid. Tile 2..30, r 7.4 (26.4%). One path, three contours, even-odd:
       tile — d outline (bowl unioned with the stem) — D-shaped bowl counter.
       No masks and no filters, so the knock-out stays crisp at any size.
       The 45 degree chamfer on the ascender is the system cut. -->
  <path fill="#E9A23B" fill-rule="evenodd" d="M2 9.4A7.4 7.4 0 0 1 9.4 2h13.2A7.4 7.4 0 0 1 30 9.4v13.2a7.4 7.4 0 0 1-7.4 7.4H9.4A7.4 7.4 0 0 1 2 22.6Z
    M19 4.9H20.4L23.6 8.1V26.6H19V26.017A7.5 7.5 0 1 1 19 12.183Z
    M19 16.492A3.9 3.9 0 1 0 19 21.708Z"/>
</svg>
