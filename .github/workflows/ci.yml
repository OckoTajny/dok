name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --release --locked

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: CLI, proxy routing, git, rollback and preview smoke tests
        run: |
          bash scripts/smoke.sh
          bash scripts/git-smoke.sh
          bash scripts/rollback-smoke.sh
          bash scripts/preview-smoke.sh
          bash scripts/auth-smoke.sh

  browser:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo build --locked
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Passkey and dashboard browser tests
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          bash scripts/ux-smoke.sh
          bash scripts/e2e-auth.sh

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Docker build and proxy smoke test
        run: bash scripts/docker-smoke.sh
