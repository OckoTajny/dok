# dok: dashboard on dok.<domain>. Per-app routers are generated by dok itself
# into dok-apps.yaml (Traefik needs an exact Host() rule to issue a certificate).
# dok runs on the desktop; Traefik on ku-bot reaches it over tailscale.
http:
  routers:
    dok-https:
      entryPoints: [https]
      rule: Host(`dok.solta.tech`)
      service: dok
      tls:
        certResolver: letsencrypt
    dok-http:
      entryPoints: [http]
      rule: Host(`dok.solta.tech`)
      middlewares: [dok-redirect-https]
      service: dok

  middlewares:
    dok-redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    dok:
      loadBalancer:
        servers:
          - url: http://100.88.8.51:8080
