[package]
name = "dok"
version = "0.1.0"
edition = "2021"
description = "Tiny self-hosted deploy platform: push, Docker, reverse proxy with TLS."
license = "MIT"
repository = "https://github.com/OckoTajny/dok"

[[bin]]
name = "dok"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = "0.3"
fs2 = "0.4"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
ignore = "0.4"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls-acme = { version = "0.15", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
webauthn-rs = { version = "0.6", default-features = false }

[profile.release]
lto = true
strip = true
